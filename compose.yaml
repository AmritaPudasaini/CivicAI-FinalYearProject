
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicai-backend
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-development-secret-key}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      STATIC_ROOT: /app/backend/staticfiles
    volumes:
      - civicai_data:/data
      - static_data:/app/backend/staticfiles
    expose:
      - "8000"
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: civicai-frontend
    ports:
      - "8080:80"
    volumes:
      - static_data:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  civicai_data:
  static_data:
